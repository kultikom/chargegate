configuration:
  language:
    name: Sprache
    description: Sprache der Weboberfläche. „auto“ richtet sich nach dem Browser.
  require_station_approval:
    name: Neue Wallboxen freigeben lassen
    description: Unbekannte Wallboxen werden abgewiesen, bis sie in der Oberfläche freigegeben sind.
  local_list_enabled:
    name: Chip-Liste auf Wallboxen übertragen
    description: Gültige Chips werden per SendLocalList auf die Boxen geschoben, damit auch bei Netzausfall geladen werden kann.
  apply_station_config:
    name: Standardeinstellungen setzen
    description: Beim Verbinden Messwert-Intervall, Messgrößen (Energie + Leistung) und StopTransactionOnInvalidId setzen (OCPP 1.6).
  heartbeat_interval:
    name: Heartbeat-Intervall (Sekunden)
  meter_value_interval:
    name: Messwert-Intervall (Sekunden)
    description: Wie oft die Wallboxen während des Ladens Messwerte senden. Kürzer = gleichmäßigere Leistungsanzeige in Home Assistant.
  mqtt_enabled:
    name: An Home Assistant übergeben (MQTT)
    description: Legt pro Wallbox ein Gerät mit Status, Leistung, Energie und aktuellem Mitarbeiter an. Nutzt automatisch die Mosquitto-Broker-App.
  employee_display:
    name: Anzeige des Mitarbeiters in Home Assistant
    description: "name: voller Name, initials: z. B. M.T., hidden: keine Mitarbeiter-Entität (Datenschutz)."
  ha_dashboard:
    name: Ladepunkt-Ansicht einrichten
    description: Installiert die ChargeGate-Karte und legt einmalig das Dashboard „Ladepunkte“ an (darf gelöscht oder angepasst werden).
  mqtt_host:
    name: MQTT-Host (optional)
    description: Nur nötig, wenn ihr nicht die Mosquitto-Broker-App nutzt.
  mqtt_port:
    name: MQTT-Port (optional)
  mqtt_username:
    name: MQTT-Benutzer (optional)
  mqtt_password:
    name: MQTT-Passwort (optional)
  log_ocpp_messages:
    name: OCPP-Nachrichten protokollieren
    description: Für die Inbetriebnahme neuer Wallbox-Typen – erzeugt viel Log.
  admin_password:
    name: Passwort für Direktzugriff
    description: Nur nötig, wenn Port 8099 freigegeben ist. Leer = Zugriff nur über die HA-Seitenleiste.
  entra_tenant_id:
    name: Entra Tenant-ID
  entra_client_id:
    name: Entra Client-ID
  entra_client_secret:
    name: Entra Client-Secret
  entra_sync_group_id:
    name: Entra-Gruppe (Objekt-ID) der ladeberechtigten Mitarbeiter
  entra_rfid_attribute:
    name: Entra-Attribut mit Chip-UID
    description: Standard extensionAttribute10, mehrere UIDs mit Komma trennen.
  entra_sync_interval_min:
    name: Sync-Intervall (Minuten)
network:
  9000/tcp: OCPP – hierhin verbinden sich die Wallboxen
  8099/tcp: Weboberfläche direkt (optional)
