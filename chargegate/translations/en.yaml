configuration:
  language:
    name: Language
    description: Language of the web UI. "auto" follows the browser.
  require_station_approval:
    name: Require approval for new stations
    description: Unknown stations are rejected until they are approved in the web UI.
  local_list_enabled:
    name: Push tag list to stations
    description: Valid tags are sent to the stations (SendLocalList) so charging keeps working during network outages.
  apply_station_config:
    name: Apply default station settings
    description: On connect, set meter value interval, measured values (energy + power) and StopTransactionOnInvalidId (OCPP 1.6).
  heartbeat_interval:
    name: Heartbeat interval (seconds)
  meter_value_interval:
    name: Meter value interval (seconds)
    description: How often stations send meter values while charging. Shorter intervals give a smoother power reading in Home Assistant.
  mqtt_enabled:
    name: Publish to Home Assistant (MQTT)
    description: Creates a device per station with status, power, energy and the current employee. Uses the Mosquitto broker app automatically.
  employee_display:
    name: Employee shown in Home Assistant
    description: "name: full name, initials: e.g. M.T., hidden: no employee entity (privacy)."
  ha_dashboard:
    name: Install the charging point dashboard
    description: Installs the ChargeGate card and creates the dashboard "Charging points" once (you can delete or edit it).
  mqtt_host:
    name: MQTT host (optional)
    description: Only if you don't use the Mosquitto broker app.
  mqtt_port:
    name: MQTT port (optional)
  mqtt_username:
    name: MQTT username (optional)
  mqtt_password:
    name: MQTT password (optional)
  log_ocpp_messages:
    name: Log OCPP messages
    description: For commissioning new station models – produces a lot of log output.
  admin_password:
    name: Password for direct access
    description: Only needed if port 8099 is enabled. Empty = access via the HA sidebar only.
  entra_tenant_id:
    name: Entra tenant ID
  entra_client_id:
    name: Entra client ID
  entra_client_secret:
    name: Entra client secret
  entra_sync_group_id:
    name: Entra group (object ID) of employees allowed to charge
  entra_rfid_attribute:
    name: Entra attribute holding the tag UID
    description: Default extensionAttribute10; separate multiple UIDs with commas.
  entra_sync_interval_min:
    name: Sync interval (minutes)
network:
  9000/tcp: OCPP – charging stations connect here
  8099/tcp: Web UI direct access (optional)
