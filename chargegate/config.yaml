name: ChargeGate
version: "1.0.0"
slug: chargegate
description: OCPP server for company-wide RFID charging access across multiple sites
url: https://github.com/kultikom/chargegate
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true

ingress: true
ingress_port: 8099
panel_icon: mdi:ev-station
panel_title: ChargeGate
panel_admin: true

ports:
  9000/tcp: 9000
  8099/tcp: null
ports_description:
  9000/tcp: OCPP – charging stations connect here
  8099/tcp: Web UI direct access (optional, otherwise via the HA sidebar only)

watchdog: tcp://[HOST]:[PORT:9000]

options:
  language: auto
  require_station_approval: true
  local_list_enabled: true
  apply_station_config: true
  heartbeat_interval: 300
  log_ocpp_messages: false
schema:
  language: list(auto|en|de)
  require_station_approval: bool
  local_list_enabled: bool
  apply_station_config: bool
  heartbeat_interval: int(30,3600)
  log_ocpp_messages: bool
  admin_password: password?
  entra_tenant_id: str?
  entra_client_id: str?
  entra_client_secret: password?
  entra_sync_group_id: str?
  entra_rfid_attribute: str?
  entra_sync_interval_min: int(5,1440)?
